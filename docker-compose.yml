services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: releasehub
      POSTGRES_USER: releasehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasehub -d releasehub"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: runtime }
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://releasehub:${POSTGRES_PASSWORD}@postgres:5432/releasehub
    volumes: [artifacts:/data/artifacts]
    ports: ["8080:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  registry:
    # Private container registry (the open-source "distribution" project, what Docker Hub runs on).
    # In production it sits behind TLS and authentication; locally it's plain HTTP on localhost.
    image: registry:2
    restart: unless-stopped
    ports: ["5001:5000"]          # host 5000 is taken by macOS AirPlay
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes: [registry:/var/lib/registry]

volumes:
  pgdata:
  artifacts:
  registry:
