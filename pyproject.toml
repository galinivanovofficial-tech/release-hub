[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releasehub"
version = "0.2.1"
description = "Tools for versioning and shipping software releases"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.12",
]
dev = ["releasehub[server]", "pytest==8.3.3", "ruff==0.6.9", "build==1.2.2", "httpx==0.27.2"]

[project.scripts]
releasehub = "releasehub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
